# ===============================
# APLICACIÓN
# ===============================
spring.application.name=auth-template

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_template_db
spring.datasource.username=alumno
spring.datasource.password=123456

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# EMAIL / SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# EMAIL - TIMEOUTS
# ===============================
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# ===============================
# FRONTEND
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:4321}

# ===============================
# SEGURIDAD - COOKIES
# ===============================
security.cookie.secure=${COOKIE_SECURE:false}

# ===============================
# PROXY / HTTPS
# ===============================
server.forward-headers-strategy=framework